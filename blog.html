<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Blog — Sofiat Adeyemi</title>
  <meta name="description" content="Blog by Sofiat Adeyemi — notes on language model reasoning, post-training, and computer vision research." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0D1B2A;
      --navy-mid: #162033;
      --navy-light: #1E2D42;
      --lavender: #9B8EC4;
      --lavender-light: #BEB3DE;
      --warm: #C8B89A;
      --white: #F0F4F8;
      --white-dim: #B8C5D0;
      --rule: rgba(155,142,196,0.2);
      --font-serif: 'DM Serif Display', Georgia, serif;
      --font-sans: 'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 64px; }
    body { background: var(--navy); color: var(--white); font-family: var(--font-sans); font-size: 16px; line-height: 1.7; min-height: 100vh; }
    a { color: var(--lavender); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--lavender-light); }

    /* ══ TOP NAV ══════════════════════════════════════════════ */
    .topnav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,27,42,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--rule);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem; height: 56px;
      max-width: 100%;
    }
    .topnav-name {
      font-family: var(--font-serif);
      font-size: 1rem; color: var(--white); white-space: nowrap;
    }
    .topnav-links { display: flex; gap: 0.15rem; align-items: center; }
    .topnav-links a {
      font-size: 0.78rem; font-weight: 500; color: var(--white-dim);
      padding: 0.4rem 0.7rem; border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .topnav-links a:hover, .topnav-links a.active { color: var(--white); border-bottom-color: var(--lavender); }
    .topnav-cv {
      font-size: 0.75rem; font-weight: 600; color: var(--navy);
      background: var(--lavender); padding: 0.35rem 0.9rem;
      margin-left: 0.5rem; transition: background 0.2s;
    }
    .topnav-cv:hover { background: var(--lavender-light); color: var(--navy); }
    .nav-mobile-toggle { display: none; background: none; border: none; color: var(--white-dim); cursor: pointer; font-size: 1.2rem; padding: 0.4rem; }
    .nav-mobile-menu { display: none; flex-direction: column; background: var(--navy-mid); border-bottom: 1px solid var(--rule); padding: 0.5rem 1.5rem 1rem; }
    .nav-mobile-menu a { font-size: 0.85rem; color: var(--white-dim); padding: 0.5rem 0; border-bottom: 1px solid var(--rule); font-weight: 500; }
    .nav-mobile-menu a:last-child { border-bottom: none; }
    .nav-mobile-menu.open { display: flex; }

    /* ══ PAGE WRAPPER ══════════════════════════════════════════ */
    .page { max-width: 1080px; margin: 0 auto; padding: 0 2rem; }

    /* ══ HERO / ABOUT — two column ══════════════════════════════ */
    #about { padding: 4rem 0 3.5rem; display: grid; grid-template-columns: 200px 1fr; gap: 3.5rem; align-items: start; }
    .about-photo-col { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .about-photo { width: 180px; height: 220px; object-fit: cover; object-position: center top; filter: grayscale(10%); display: block; }
    .about-icon-links { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
    .icon-link {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border: 1px solid var(--rule);
      color: var(--white-dim); font-size: 0.75rem; font-weight: 700;
      transition: border-color 0.2s, color 0.2s;
    }
    .icon-link:hover { border-color: var(--lavender); color: var(--lavender); }
    .icon-link svg { width: 15px; height: 15px; fill: currentColor; }
    .about-content {}
    .about-name { font-family: var(--font-serif); font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; color: var(--white); margin-bottom: 0.3rem; }
    .about-name em { font-style: italic; color: var(--lavender); }
    .about-tagline { font-size: 0.82rem; color: var(--lavender); font-weight: 500; margin-bottom: 0.2rem; letter-spacing: 0.02em; }
    .about-inst { font-size: 0.78rem; color: var(--white-dim); margin-bottom: 1.5rem; }
    .about-inst a { color: var(--white-dim); }
    .about-inst a:hover { color: var(--lavender-light); }
    .about-body p { font-size: 0.91rem; color: var(--white-dim); line-height: 1.82; margin-bottom: 0.95rem; }
    .about-body p:last-child { margin-bottom: 0; }
    .about-body strong { color: var(--white); font-weight: 500; }
    .about-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.5rem; }
    .btn-primary { display: inline-block; background: var(--lavender); color: var(--navy); font-size: 0.78rem; font-weight: 600; padding: 0.55rem 1.3rem; transition: background 0.2s; }
    .btn-primary:hover { background: var(--lavender-light); color: var(--navy); }
    .btn-secondary { display: inline-block; border: 1px solid var(--rule); color: var(--white-dim); font-size: 0.78rem; font-weight: 500; padding: 0.55rem 1.3rem; transition: border-color 0.2s, color 0.2s; }
    .btn-secondary:hover { border-color: var(--lavender); color: var(--white); }

    /* ══ SECTION SHELL ═════════════════════════════════════════ */
    .section { padding: 3.5rem 0; border-top: 1px solid var(--rule); scroll-margin-top: 64px; }
    .section-label {
      font-size: 0.67rem; font-weight: 600; color: var(--lavender);
      letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 1.6rem; display: flex; align-items: center; gap: 0.75rem;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

    /* ══ NEWS ══════════════════════════════════════════════════ */
    .news-list { display: flex; flex-direction: column; gap: 0; }
    .news-item { display: grid; grid-template-columns: 80px 1fr; gap: 1.2rem; padding: 0.75rem 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
    .news-item:first-child { border-top: 1px solid var(--rule); }
    .news-date { font-size: 0.72rem; color: var(--lavender); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .news-text { font-size: 0.85rem; color: var(--white-dim); line-height: 1.65; }
    .news-text strong { color: var(--white); font-weight: 500; }
    .news-text a { color: var(--lavender); }

    /* ══ PUBLICATIONS ═══════════════════════════════════════════ */
    .pub-item { padding: 1.6rem 0; border-bottom: 1px solid var(--rule); }
    .pub-item:first-of-type { border-top: 1px solid var(--rule); }
    .pub-venue-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.45rem; }
    .pub-venue { font-size: 0.68rem; font-weight: 600; color: var(--lavender); text-transform: uppercase; letter-spacing: 0.07em; }
    .pub-title { font-family: var(--font-serif); font-size: 1.03rem; color: var(--white); line-height: 1.3; margin-bottom: 0.35rem; }
    .pub-authors { font-size: 0.78rem; color: var(--white-dim); font-style: italic; margin-bottom: 0.35rem; }
    .pub-authors strong { color: var(--lavender-light); font-style: normal; font-weight: 600; }
    .pub-desc { font-size: 0.82rem; color: var(--white-dim); line-height: 1.72; max-width: 72ch; margin-bottom: 0.9rem; }
    .pub-desc strong { color: var(--white); font-weight: 600; }
    .pub-desc em { color: var(--warm); font-style: normal; }
    .pub-links { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
    .pub-link {
      font-size: 0.71rem; font-weight: 600; color: var(--white-dim);
      border: 1px solid var(--rule); padding: 0.2rem 0.6rem;
      transition: border-color 0.2s, color 0.2s;
    }
    .pub-link:hover { border-color: var(--lavender); color: var(--lavender); }
    .findings-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-bottom: 1rem; }
    .finding { background: var(--navy); padding: 0.9rem 1rem; }
    .finding-val { font-family: var(--font-serif); font-size: 1.35rem; color: var(--lavender); line-height: 1.1; margin-bottom: 0.2rem; }
    .finding-label { font-size: 0.67rem; color: var(--white-dim); line-height: 1.5; }

    /* ══ EXPERIENCE ════════════════════════════════════════════ */
    .exp-item { padding: 1.6rem 0; border-bottom: 1px solid var(--rule); }
    .exp-item:first-of-type { border-top: 1px solid var(--rule); }
    .exp-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .exp-title { font-size: 0.95rem; font-weight: 600; color: var(--white); margin-bottom: 0.18rem; }
    .exp-org { font-size: 0.8rem; color: var(--lavender); font-weight: 500; }
    .exp-meta { text-align: right; flex-shrink: 0; }
    .exp-date { font-size: 0.76rem; color: var(--white-dim); font-weight: 500; margin-bottom: 0.12rem; }
    .exp-advisor { font-size: 0.72rem; color: var(--white-dim); font-style: italic; }
    .exp-desc { font-size: 0.83rem; color: var(--white-dim); line-height: 1.77; max-width: 70ch; margin-bottom: 0.85rem; }

    /* ══ RESEARCH ══════════════════════════════════════════════ */
    .research-item { padding: 2rem 0; border-bottom: 1px solid var(--rule); }
    .research-item:first-of-type { border-top: 1px solid var(--rule); }
    .research-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
    .research-venue-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .research-venue { font-size: 0.68rem; font-weight: 600; color: var(--lavender); text-transform: uppercase; letter-spacing: 0.07em; }
    .research-title { font-family: var(--font-serif); font-size: 1.06rem; color: var(--white); line-height: 1.3; margin-bottom: 0.4rem; }
    .research-authors { font-size: 0.77rem; color: var(--white-dim); font-style: italic; margin-bottom: 1rem; }
    .research-body p { font-size: 0.83rem; color: var(--white-dim); line-height: 1.78; max-width: 72ch; margin-bottom: 0.75rem; }
    .research-body strong { color: var(--white); font-weight: 600; }
    .research-body em { color: var(--warm); font-style: normal; }
    .project-link { font-size: 0.77rem; font-weight: 600; color: var(--lavender); white-space: nowrap; }

    /* ══ TAGS ══════════════════════════════════════════════════ */
    .tag-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
    .stack-tag { font-size: 0.67rem; color: var(--white-dim); border: 1px solid var(--rule); padding: 0.13rem 0.5rem; }
    .tag { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.13rem 0.5rem; }
    .tag-active { background: rgba(155,142,196,0.13); color: var(--lavender); }
    .tag-warm { background: rgba(200,184,154,0.12); color: var(--warm); }
    .tag-done { background: rgba(176,196,222,0.07); color: var(--white-dim); }

    /* ══ PROJECTS ══════════════════════════════════════════════ */
    .project { padding: 1.6rem 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 1.5rem; align-items: start; }
    .project:first-of-type { border-top: 1px solid var(--rule); }
    .project-meta { font-size: 0.71rem; color: var(--lavender); font-weight: 500; margin-bottom: 0.4rem; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    .project-title { font-family: var(--font-serif); font-size: 1.02rem; color: var(--white); margin-bottom: 0.5rem; line-height: 1.3; }
    .project-desc { font-size: 0.83rem; color: var(--white-dim); line-height: 1.74; max-width: 65ch; margin-bottom: 0.8rem; }

    /* ══ INTERESTS ═════════════════════════════════════════════ */
    .interests-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
    .interest-item { background: var(--navy); padding: 1.3rem 1.5rem; }
    .interest-title { font-size: 0.87rem; font-weight: 600; color: var(--white); margin-bottom: 0.35rem; }
    .interest-desc { font-size: 0.78rem; color: var(--white-dim); line-height: 1.65; }
    .interests-extended { margin-top: 1.4rem; }
    .interests-extended-label { font-size: 0.7rem; font-weight: 600; color: var(--white-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.65rem; }
    .interests-tags { display: flex; flex-wrap: wrap; gap: 0.42rem; }
    .interest-tag { font-size: 0.74rem; color: var(--white-dim); border: 1px solid var(--rule); padding: 0.18rem 0.6rem; }
    .interests-grid.three { grid-template-columns: repeat(3, 1fr); }
    .interest-list { list-style: none; margin-top: 0.5rem; }
    .interest-list li { font-size: 0.8rem; color: var(--white-dim); line-height: 1.6; padding: 0.3rem 0 0.3rem 0.9rem; position: relative; border-top: 1px solid var(--rule); }
    .interest-list li:first-child { border-top: none; }
    .interest-list li::before { content: ''; position: absolute; left: 0; top: 0.85rem; width: 4px; height: 4px; background: var(--lavender); }

    /* ══ SKILLS ════════════════════════════════════════════════ */
    .skills-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2rem; }
    .skill-group-title { font-size: 0.7rem; font-weight: 600; color: var(--lavender); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.85rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--rule); }
    .skill-list { list-style: none; display: flex; flex-direction: column; gap: 0.38rem; }
    .skill-list li { font-size: 0.8rem; color: var(--white-dim); display: flex; align-items: center; gap: 0.5rem; }
    .skill-list li::before { content: ''; width: 4px; height: 4px; background: var(--lavender); flex-shrink: 0; }

    /* ══ CONTACT ═══════════════════════════════════════════════ */
    .contact-inner { max-width: 52ch; }
    .contact-inner p { font-size: 0.91rem; color: var(--white-dim); margin-bottom: 2rem; line-height: 1.78; }
    .contact-list { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
    .contact-list li { font-size: 0.83rem; color: var(--white-dim); display: flex; align-items: center; gap: 0.75rem; }
    .contact-list a { color: var(--white); font-weight: 500; }
    .contact-label { font-size: 0.67rem; font-weight: 600; color: var(--lavender); text-transform: uppercase; letter-spacing: 0.06em; width: 62px; flex-shrink: 0; }

    /* ══ BLOG ══════════════════════════════════════════════════ */
    .blog-item { display: grid; grid-template-columns: 90px 1fr; gap: 1.2rem; padding: 1.1rem 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
    .blog-item:first-child { border-top: 1px solid var(--rule); }
    .blog-date { font-size: 0.72rem; color: var(--lavender); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .blog-title { font-family: var(--font-serif); font-size: 1.03rem; line-height: 1.3; margin-bottom: 0.3rem; }
    .blog-title a { color: var(--white); }
    .blog-title a:hover { color: var(--lavender-light); }
    .blog-desc { font-size: 0.82rem; color: var(--white-dim); line-height: 1.7; max-width: 72ch; margin-bottom: 0.5rem; }
    .blog-empty { font-size: 0.85rem; color: var(--white-dim); }

    /* ══ FOOTER ════════════════════════════════════════════════ */
    footer { border-top: 1px solid var(--rule); padding: 2rem; max-width: 1080px; margin: 0 auto; font-size: 0.72rem; color: var(--white-dim); opacity: 0.45; }

    /* ══ MOBILE ════════════════════════════════════════════════ */
    @media (max-width: 760px) {
      .topnav-links { display: none; }
      .nav-mobile-toggle { display: block; }
      #about { grid-template-columns: 1fr; padding: 2.5rem 0 2rem; }
      .about-photo-col { flex-direction: row; justify-content: flex-start; align-items: flex-end; gap: 1.5rem; }
      .about-photo { width: 100px; height: 125px; }
      .interests-grid { grid-template-columns: 1fr; }
      .interests-grid.three { grid-template-columns: 1fr; }
      .skills-grid { grid-template-columns: 1fr 1fr; }
      .findings-grid { grid-template-columns: 1fr 1fr; }
      .project { grid-template-columns: 1fr; }
      .exp-meta { text-align: left; }
      .blog-item { grid-template-columns: 1fr; gap: 0.3rem; }
      .page { padding: 0 1.2rem; }
    }
    @media (max-width: 480px) {
      .skills-grid { grid-template-columns: 1fr; }
      .about-photo-col { flex-direction: column; align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>

<div class="page">
  <section class="section" style="border-top:none;padding-top:4rem;">
    <h1 class="about-name">Blog</h1>
    <div id="blog-container" style="margin-top:1.6rem;"><p class="blog-empty">Posts coming soon.</p></div>
  </section>
</div>

<footer>© 2026 Sofiat Adeyemi · <a href="index.html" style="color:inherit;">Back to portfolio</a></footer>

<script>
  // Add a post by adding an object to POSTS (newest first). `url` is optional.
  const POSTS = [
    // { title: 'Post title', date: 'Nov 2026', summary: 'One or two sentences.', url: 'https://...', tags: ['RLVR', 'GPT-2'] },
  ];
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  (function renderBlog(){
    const c=document.getElementById('blog-container');
    if(!c||!POSTS.length)return;
    c.innerHTML=POSTS.map(p=>`
      <div class="blog-item">
        <div class="blog-date">${esc(p.date||'')}</div>
        <div>
          <div class="blog-title">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`:esc(p.title)}</div>
          ${p.summary?`<p class="blog-desc">${esc(p.summary)}</p>`:''}
          ${p.tags&&p.tags.length?`<div class="tag-row">${p.tags.map(t=>`<span class="stack-tag">${esc(t)}</span>`).join('')}</div>`:''}
        </div>
      </div>`).join('');
  })();

  document.querySelectorAll('.nav-mobile-menu a').forEach(a=>{
    a.addEventListener('click',()=>document.querySelector('.nav-mobile-menu').classList.remove('open'));
  });
</script>
